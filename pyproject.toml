[project]
name = "recomps"
version = "0.1.0"
description = "Market-agnostic engine for researching real-estate comps, with an LLM-orchestrated research layer and live-formula Excel output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gregory Babior" }]
keywords = ["agentic-ai", "claude", "real-estate", "web-research", "llm-orchestration"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "openpyxl>=3.1",
  "click>=8.1",
]

[project.optional-dependencies]
# The research layer drives the Messages API directly rather than an agent
# framework: the workers here are bounded extraction tasks against a strict
# schema, and the fetching has to stay on this machine so the politeness
# rules are actually enforceable.
# httpx2 is pinned to the major version this code has actually run against.
# ">=0.1" spanned two majors of the library that makes every outbound request,
# so a fresh install could resolve something the code has never seen.
# pydantic defines the extraction schemas the workers must return. It
# arrives with the Anthropic SDK too, but this layer imports it directly,
# so it is declared rather than inherited by luck.
live = ["anthropic>=1.0", "httpx2>=2.0,<3", "pydantic>=2.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# The interface. Kept optional so the engine, the CLI and the whole test
# suite install and run without it. pandas arrives with Streamlit anyway, but
# the interface imports it directly to colour table rows, so it is declared
# rather than relied on as somebody else's transitive dependency.
ui = ["streamlit>=1.40", "pandas>=1.4"]

[project.scripts]
recomps = "recomps.cli:main"

[project.entry-points."recomps.markets"]
demoville = "recomps.markets.demoville:MARKET"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recomps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot change what CI enforces.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ISC", "RUF"]
ignore = [
  # The research and plugin layers catch broad exceptions on purpose: a source
  # that fails must log and let the run continue, and a third-party plugin must
  # not be able to crash the CLI.
  "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
