[project]
name = "lotcomps"
version = "0.1.0"
description = "Market-agnostic engine for researching real-estate comps, with an LLM-orchestrated research layer and live-formula Excel output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel Babior" }]
keywords = ["agentic-ai", "claude", "real-estate", "web-research", "llm-orchestration"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "openpyxl>=3.1",
  "click>=8.1",
]

[project.optional-dependencies]
live = ["httpx>=0.27", "claude-agent-sdk>=0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
lotcomps = "lotcomps.cli:main"

[project.entry-points."lotcomps.markets"]
demoville = "lotcomps.markets.demoville:MARKET"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotcomps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot change what CI enforces.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ISC", "RUF"]
ignore = [
  # The research and plugin layers catch broad exceptions on purpose: a source
  # that fails must log and let the run continue, and a third-party plugin must
  # not be able to crash the CLI.
  "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
